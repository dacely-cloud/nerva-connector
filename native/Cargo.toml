[package]
name = "nerva-connector-files"
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary"

[profile.release]
strip = "symbols"

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "=0.5.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
tempfile = "=3.27.0"
